name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Generate Wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Run unit tests
        run: ./gradlew clean testDebugUnitTest --no-daemon > build.log 2>&1 || (cat build.log && exit 1)

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon > build.log 2>&1 || (cat build.log && exit 1)

      - name: Commit build log
        if: failure()
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git add build.log
          git commit -m "ci: upload build log"
          git push

