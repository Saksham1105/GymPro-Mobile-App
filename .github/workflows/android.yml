name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Run CI and Capture Log
        run: |
          ./gradlew clean testDebugUnitTest --no-daemon > build.log 2>&1 || true
          ./gradlew assembleDebug --no-daemon >> build.log 2>&1 || true

      - name: Check Status and Upload
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git add build.log || true
          git commit -m "ci: upload build log" || true
          git push || true
          exit 1

